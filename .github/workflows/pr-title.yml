name: PR title convention

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      # Read only event metadata; never check out or execute pull-request code.
      - name: Validate Conventional Commit title
        shell: python
        run: |
          import json
          import os
          import re
          import sys

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as event:
              title = json.load(event)['pull_request']['title']
          pattern = r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\s]+\))?!?: [^\s].*'
          if not re.fullmatch(pattern, title):
              print('::error::Use a PR title such as feat: add export or fix(ui): show connection progress')
              sys.exit(1)
          print('PR title follows the required convention.')
