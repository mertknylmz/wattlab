[package]
name = "wattlab-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "WattLab local training API"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
uuid = { version = "1", features = ["serde", "v4"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
